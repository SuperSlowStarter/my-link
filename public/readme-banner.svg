<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0f1016" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E63" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.05" />
    </pattern>

    <style>
      .title-back {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 86px;
        letter-spacing: -3px;
        fill: none;
        stroke: url(#accentGrad);
        stroke-width: 1.5;
        opacity: 0.35;
        animation: shiftDepth 6s ease-in-out infinite alternate;
      }
      .title-mid {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 86px;
        letter-spacing: -3px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 1;
        opacity: 0.15;
        animation: shiftDepthMid 6s ease-in-out infinite alternate;
      }
      .title-front {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 86px;
        letter-spacing: -3px;
        fill: url(#textGrad);
      }
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 13px;
        letter-spacing: 3px;
        fill: #71717A;
      }
      .mono-accent {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 13px;
        letter-spacing: 4px;
        fill: #00F5D4;
        font-weight: 700;
      }
      .sub-kr {
        font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 1px;
        fill: #D4D4D8;
      }
      .bezier-path {
        stroke-dasharray: 900;
        stroke-dashoffset: 900;
        animation: drawCurve 5s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
      }
      .keyframe {
        animation: pulseKf 2.5s ease-in-out infinite;
        transform-origin: center;
      }
      @keyframes shiftDepth {
        0% { transform: translate(-8px, -6px); }
        100% { transform: translate(10px, 8px); }
      }
      @keyframes shiftDepthMid {
        0% { transform: translate(-4px, -3px); }
        100% { transform: translate(5px, 4px); }
      }
      @keyframes drawCurve {
        0% { stroke-dashoffset: 900; opacity: 0.2; }
        100% { stroke-dashoffset: 0; opacity: 0.85; }
      }
      @keyframes pulseKf {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="20" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="220" cy="100" r="140" fill="#FF2E63" opacity="0.08" filter="url(#glow)" />
  <circle cx="980" cy="320" r="160" fill="#00F5D4" opacity="0.08" filter="url(#glow)" />
  <circle cx="600" cy="210" r="200" fill="#7928CA" opacity="0.06" filter="url(#glow)" />

  <!-- Animated Speed / Value Graph Curve (After Effects Motif) -->
  <path class="bezier-path" d="M 80 340 C 320 340, 360 90, 600 210 C 840 330, 880 80, 1120 80" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
  <line x1="80" y1="340" x2="320" y2="340" stroke="#FF2E63" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
  <line x1="1120" y1="80" x2="880" y2="80" stroke="#00F5D4" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
  <circle cx="320" cy="340" r="4" fill="#FF2E63" opacity="0.8" />
  <circle cx="880" cy="80" r="4" fill="#00F5D4" opacity="0.8" />

  <!-- Keyframe Diamonds -->
  <polygon class="keyframe" points="80,332 88,340 80,348 72,340" fill="#FF2E63" />
  <polygon class="keyframe" points="600,202 608,210 600,218 592,210" fill="#FFFFFF" />
  <polygon class="keyframe" points="1120,72 1128,80 1120,88 1112,80" fill="#00F5D4" />

  <!-- Top HUD / Timeline Bar -->
  <text x="60" y="52" class="mono">REC ● 00:00:07:24</text>
  <text x="600" y="52" text-anchor="middle" class="mono-accent">2D TO FAKE 3D // KINETIC ARTISTRY</text>
  <text x="1140" y="52" text-anchor="end" class="mono">60 FPS / CUBIC-BEZIER(0.16, 1, 0.3, 1)</text>
  <line x1="60" y1="68" x2="1140" y2="68" stroke="#27272A" stroke-width="1" />

  <!-- Fake 3D Layered Main Title -->
  <g transform="translate(600, 215)" text-anchor="middle">
    <text class="title-back">BEYOND THE FRAME</text>
    <text class="title-mid">BEYOND THE FRAME</text>
    <text class="title-front">BEYOND THE FRAME</text>
  </g>

  <!-- Subtitle & Identity -->
  <text x="600" y="278" text-anchor="middle" class="sub-kr">
    평면의 한계를 넘어 입체적 감각을 설계하는 모션그래픽 디자이너, 이대건
  </text>

  <!-- Bottom Timeline Ruler -->
  <line x1="60" y1="365" x2="1140" y2="365" stroke="#27272A" stroke-width="1" />
  <text x="60" y="390" class="mono">KEYFRAME 01 // TENSION</text>
  <text x="600" y="390" text-anchor="middle" class="mono">KEYFRAME 02 // DIMENSION</text>
  <text x="1140" y="390" text-anchor="end" class="mono">KEYFRAME 03 // RESONANCE</text>

  <!-- Subtle Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="20" fill="none" stroke="#27272A" stroke-width="2" />
</svg>
